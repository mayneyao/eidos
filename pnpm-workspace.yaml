packages:
  # all packages in direct subdirs of packages/
  - "packages/*"
  - "apps/*"
  # built-in extensions
  - "extensions/blocks/*"
  - "extensions/scripts/*"
  # exclude packages that are inside test directories
  - "!**/test/**"

peerDependencyRules:
  ignoreMissing:
    - "next"
    - "solid-js"
    - "svelte"
    - "vue"
    - "@lobehub/ui"

onlyBuiltDependencies:
  - "@vscode/ripgrep"
  - "better-sqlite3"
  - "electron"
  - "node-pty"

overrides:
  "@eidos.space/bashkit": "^0.6.5"
  "fast-xml-parser": "^5.5.1"
  "tar": "^7.5.11"
  "svgo": "^4.0.1"
  "serialize-javascript": "^7.0.4"
  "@tootallnate/once": "^3.0.1"
  "node-abi": "^4.28.0"
