  - "@eidos.space/graft-linux-x64-gnu@0.3.26 || 0.3.27"
  - "@eidos.space/graft-win32-x64-msvc@0.3.26 || 0.3.27"
  - "@lexical/a11y@0.50.0"
  - "@lexical/clipboard@0.50.0"
  - "@lexical/code-core@0.50.0"
  - "@lexical/devtools-core@0.50.0"
  - "@lexical/dragon@0.50.0"
  - "@lexical/extension@0.50.0"
  - "@lexical/hashtag@0.50.0"
  - "@lexical/history@0.50.0"
  - "@lexical/html@0.50.0"
  - "@lexical/internal@0.50.0"
  - "@lexical/link@0.50.0"
  - "@lexical/list@0.50.0"
  - "@lexical/mark@0.50.0"
  - "@lexical/markdown@0.50.0"
  - "@lexical/overflow@0.50.0"
  - "@lexical/plain-text@0.50.0"
  - "@lexical/react@0.50.0"
  - "@lexical/rich-text@0.50.0"
  - "@lexical/selection@0.50.0"
  - "@lexical/table@0.50.0"
  - "@lexical/text@0.50.0"
  - "@lexical/utils@0.50.0"
  - "@lexical/yjs@0.50.0"
  - lexical@0.50.0
  - "@eidos.space/graft-remote-cloudflare@0.2.4"
  - "@eidos.space/graft-remote-hono@0.2.4"
  - "@eidos.space/graft-remote@0.2.4"
minimumReleaseAgeExcludePrune: true

peerDependencyRules:
  ignoreMissing:
    - "next"
    - "solid-js"
    - "svelte"
    - "vue"
    - "@lobehub/ui"

packageExtensions:
  "vite-plugin-electron@1.1.0":
    peerDependencies:
      vite: "^8.1.0"

allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  better-sqlite3: true
  bufferutil: false
  electron: true
  electron-winstaller: false
  esbuild: false
  node-pty: true
  sharp: false
  utf-8-validate: false
  workerd: false

