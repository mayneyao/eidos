packages:
  # all packages in direct subdirs of packages/
  - "packages/*"
  - "apps/*"
  # exclude packages that are inside test directories
  - "!**/test/**"

pmOnFail: ignore

minimumReleaseAgeExclude:
  - "@eidos.space/graft@0.3.25"
  - "@eidos.space/graft-darwin-arm64@0.3.25"
  - "@eidos.space/graft-darwin-x64@0.3.25"
  - "@eidos.space/graft-linux-arm64-gnu@0.3.25"
  - "@eidos.space/graft-linux-x64-gnu@0.3.25"
  - "@eidos.space/graft-win32-x64-msvc@0.3.25"
  - "@lexical/a11y@0.50.0"
  - "@lexical/clipboard@0.50.0"
  - "@lexical/code-core@0.50.0"
  - "@lexical/devtools-core@0.50.0"
  - "@lexical/dragon@0.50.0"
  - "@lexical/extension@0.50.0"
  - "@lexical/hashtag@0.50.0"
  - "@lexical/history@0.50.0"
  - "@lexical/html@0.50.0"
  - "@lexical/internal@0.50.0"
  - "@lexical/link@0.50.0"
  - "@lexical/list@0.50.0"
  - "@lexical/mark@0.50.0"
  - "@lexical/markdown@0.50.0"
  - "@lexical/overflow@0.50.0"
  - "@lexical/plain-text@0.50.0"
  - "@lexical/react@0.50.0"
  - "@lexical/rich-text@0.50.0"
  - "@lexical/selection@0.50.0"
  - "@lexical/table@0.50.0"
  - "@lexical/text@0.50.0"
  - "@lexical/utils@0.50.0"
  - "@lexical/yjs@0.50.0"
  - "lexical@0.50.0"
minimumReleaseAgeExcludePrune: true

peerDependencyRules:
  ignoreMissing:
    - "next"
    - "solid-js"
    - "svelte"
    - "vue"
    - "@lobehub/ui"

packageExtensions:
  "vite-plugin-electron@1.1.0":
    peerDependencies:
      vite: "^8.1.0"

allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  better-sqlite3: true
  bufferutil: false
  electron: true
  esbuild: false
  node-pty: true
  sharp: false
  utf-8-validate: false
  workerd: false

overrides:
  "@eidos.space/bashkit": "^0.6.5"
  "@babel/core": "7.29.6"
  "@protobufjs/utf8": "1.1.1"
  "@xmldom/xmldom": "0.8.13"
  "brace-expansion@>=2.0.0 <2.0.3": "2.0.3"
  "defu@6.1.4": "6.1.5"
  "esbuild@>=0.27.3 <0.28.1": "0.28.1"
  "fast-xml-parser": "5.7.0"
  "form-data@>=4.0.0 <4.0.6": "4.0.6"
  "glob@>=10.2.0 <10.5.0": "10.5.0"
  "js-cookie@<=3.0.5": "3.0.7"
  "js-yaml@>=4.0.0 <=4.1.1": "4.2.0"
  "linkify-it@<=5.0.0": "5.0.1"
  "lodash": "4.18.1"
  "lodash-es@>=4.0.0 <=4.17.23": "4.18.1"
  "markdown-it@>=13.0.0 <=14.1.1": "14.2.0"
  "mdast-util-to-hast@>=13.0.0 <13.2.1": "13.2.1"
  "onnx-proto>protobufjs": "7.6.3"
  "path-to-regexp@<0.1.13": "0.1.13"
  "picomatch@>=4.0.0 <4.0.4": "4.0.4"
  "qs@>=6.7.0 <=6.15.1": "6.15.2"
  "tar": "7.5.16"
  "tar-fs@>=2.0.0 <2.1.4": "2.1.4"
  "tar-fs@>=3.0.0 <3.1.1": "3.1.1"
  "tmp@>=0.2.0 <0.2.7": "0.2.7"
  "vite-plugin-top-level-await>uuid": "11.1.1"
  "vitest@3.2.4": "3.2.6"
  "ws@>=8.0.0 <8.21.0": "8.21.0"
  "svgo": "^4.0.1"
  "serialize-javascript": "^7.0.4"
  "@tootallnate/once": "^3.0.1"
  "node-abi": "^4.28.0"
