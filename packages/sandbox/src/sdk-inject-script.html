<script type="module">
  import { createEidosClient } from '/eidos-client.js';

  const EIDOS_CONFIG = {
    httpEndpoint: "http://${{currentSpace}}.eidos.localhost:13127/rpc",
    timeout: 30000,
  }

  // Replace window.fetch with proxy-enabled fetch
  const originalFetch = window.fetch
  window.fetch = async function (input, init = {}) {
    const url = typeof input === "string" ? input : input.url
    try {
      const requestUrl = new URL(url, window.location.href)
      const currentOrigin = window.location.origin
      const requestOrigin = requestUrl.origin

      if (
        requestOrigin === currentOrigin ||
        requestUrl.hostname === "proxy.eidos.localhost" ||
        requestUrl.hostname === "localhost" ||
        requestUrl.hostname.endsWith(".eidos.localhost")
      ) {
        return originalFetch(input, init)
      }

      const proxyUrl = `http://proxy.eidos.localhost:13127/?url=${encodeURIComponent(url)}`
      return originalFetch(proxyUrl, {
        ...init,
        headers: {
          ...init.headers,
        },
      })
    } catch (error) {
      console.warn("Failed to parse URL for proxy, using original fetch:", error)
      return originalFetch(input, init)
    }
  }

  // Initialize Eidos Client
  const client = createEidosClient({
    endpoint: EIDOS_CONFIG.httpEndpoint,
    timeout: EIDOS_CONFIG.timeout,
    // Add apiKey if available in bindings or elsewhere
  });

  // Setup window.eidos to match the legacy structure
  window.eidos = {
    ...client,
    get space() { return client.currentSpace },
    get currentSpace() { return client.currentSpace },
  };

  // Handle ScriptFunctionCall messages (for script execution in sandbox)
  window.addEventListener("message", async (event) => {
    const { type, data } = event.data
    const port = event.ports[0]
    if (type === "ScriptFunctionCall") {
      const { input, context, id, hash, command, bindings } = data
      window.__EIDOS_BINDINGS__ = bindings || {}

      const env = Object.entries(bindings || {}).reduce((acc, [key, binding]) => {
        if (binding.type === "secret" || binding.type === "text") {
          acc[key] = binding.value
        }
        return acc
      }, {})
      context.env = env

      try {
        const module = await import(`/${id}.js?t=${hash || Date.now()}`)
        const res = await module[command](input, context)
        port.postMessage({ type: "ScriptFunctionCallResponse", data: res })
      } catch (error) {
        port.postMessage({ type: "ScriptFunctionCallError", data: error })
      }
    }
  })
</script>
