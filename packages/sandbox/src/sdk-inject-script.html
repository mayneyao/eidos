<script type="module">
  import { createEidosClient } from '/eidos-client.js';

  // 1. Detect environment and base domain at runtime
  const { hostname, port, protocol, origin: currentOrigin } = window.location;
  const portSuffix = port ? `:${port}` : '';
  const parts = hostname.split('.');

  let baseDomain = '';
  let rpcEndpoint = '';
  let proxyBaseUrl = '';

  if (hostname.endsWith('eidos.localhost')) {
    // Desktop Environment: <ext-id>.block.<spaceId>.eidos.localhost
    baseDomain = 'eidos.localhost';
    rpcEndpoint = `${protocol}//${{currentSpace}}.eidos.localhost${portSuffix}/rpc`;
    proxyBaseUrl = `${protocol}//proxy.eidos.localhost${portSuffix}`;
  } else {
    // Non-Desktop Environment: <ext-id>.<baseDomain>
    // Note: We take everything after the first part as the base domain
    baseDomain = parts.slice(1).join('.');
    
    // In headless, the RPC and Proxy usually live on the base domain directly
    rpcEndpoint = `${protocol}//${baseDomain}${portSuffix}/rpc`;
    proxyBaseUrl = `${protocol}//proxy.${baseDomain}${portSuffix}`;
  }

  const EIDOS_CONFIG = {
    httpEndpoint: rpcEndpoint,
    timeout: 30000,
  }

  // 2. Optimized window.fetch proxy
  const originalFetch = window.fetch
  window.fetch = async function (input, init = {}) {
    const url = typeof input === "string" ? input : input.url
    try {
      const requestUrl = new URL(url, window.location.href)
      const reqHostname = requestUrl.hostname

      // Bypass proxy for internal/same-system requests
      const isInternal = 
        requestUrl.origin === currentOrigin ||
        reqHostname === "localhost" ||
        reqHostname === baseDomain ||
        reqHostname === `proxy.${baseDomain}` ||
        reqHostname.endsWith(`.${baseDomain}`);

      if (isInternal) {
        return originalFetch(input, init)
      }

      const proxyUrl = `${proxyBaseUrl}/?url=${encodeURIComponent(url)}`
      return originalFetch(proxyUrl, init)
    } catch (error) {
      console.warn("Failed to parse URL for proxy, using original fetch:", error)
      return originalFetch(input, init)
    }
  }

  // 3. Initialize Eidos Client
  const client = createEidosClient({
    endpoint: EIDOS_CONFIG.httpEndpoint,
    timeout: EIDOS_CONFIG.timeout,
  });

  // 4. Proxy window.eidos to currentSpace
  window.eidos = new Proxy(client.currentSpace, {
    get(target, prop) {
      if (prop === 'space' || prop === 'currentSpace') return target;
      if (prop === 'client') return client;
      return target[prop];
    }
  });

  // 5. Shared logic for script execution in sandbox
  window.addEventListener("message", async (event) => {
    const { type, data } = event.data
    const port = event.ports[0]
    if (type === "ScriptFunctionCall") {
      const { input, context, id, hash, command, bindings } = data
      window.__EIDOS_BINDINGS__ = bindings || {}

      const env = Object.entries(bindings || {}).reduce((acc, [key, binding]) => {
        if (binding.type === "secret" || binding.type === "text") {
          acc[key] = binding.value
        }
        return acc
      }, {})
      context.env = env

      try {
        const module = await import(`/${id}.js?t=${hash || Date.now()}`)
        const res = await module[command](input, context)
        port.postMessage({ type: "ScriptFunctionCallResponse", data: res })
      } catch (error) {
        port.postMessage({ type: "ScriptFunctionCallError", data: error })
      }
    }
  })
</script>
