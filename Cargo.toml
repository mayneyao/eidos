[workspace]
resolver = "2"
members = ["apps/cli", "apps/plugin-sandbox", "crates/*"]
default-members = ["apps/cli"]

[workspace.dependencies]
eidos-file-core = { path = "crates/eidos-file-core" }
eidos-file-runtime = { path = "crates/eidos-file-runtime" }
eidos-runtime-host = { path = "crates/eidos-runtime-host", default-features = false }
eidos-publish = { path = "crates/eidos-publish" }
rusqlite = { version = "0.38", features = ["bundled"] }
graft-sdk = { git = "https://github.com/eidos-space/graft", rev = "6c53e90eee6d12391dd7cd12d1707ad114350fdc", features = [
  "bundled-sqlite",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
