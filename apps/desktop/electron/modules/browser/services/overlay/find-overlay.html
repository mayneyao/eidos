<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      background: transparent !important;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 8px;
      margin: 0;
    }
    
    .find-box {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.05);
      padding: 6px 8px;
      min-width: 280px;
    }
    
    .search-icon {
      width: 16px;
      height: 16px;
      color: #666;
      flex-shrink: 0;
    }
    
    .find-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 14px;
      color: #333;
      background: transparent;
      min-width: 0;
    }
    
    .find-input::placeholder {
      color: #999;
    }
    
    .match-count {
      font-size: 13px;
      color: #666;
      padding: 0 4px;
      white-space: nowrap;
    }
    
    .btn {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: 4px;
      color: #666;
      cursor: pointer;
      flex-shrink: 0;
    }
    
    .btn:hover {
      background: rgba(0, 0, 0, 0.06);
      color: #333;
    }
    
    .btn:disabled {
      opacity: 0.3;
      cursor: default;
      background: transparent;
    }
    
    .btn svg {
      width: 14px;
      height: 14px;
    }
    
    .btn-close {
      margin-left: 2px;
    }
    
    .divider {
      width: 1px;
      height: 20px;
      background: #e0e0e0;
      margin: 0 4px;
    }
  </style>
</head>
<body>
  <div class="find-box">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"></circle>
      <path d="m21 21-4.35-4.35"></path>
    </svg>
    <input 
      type="text" 
      class="find-input" 
      id="findInput" 
      placeholder="Find in page..."
      autocomplete="off"
      value="{{findText}}"
    />
    <span class="match-count" id="matchCount">{{matchCountText}}</span>
    <button class="btn" id="btnPrev" title="Previous" {{prevDisabled}}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="18 15 12 9 6 15"></polyline>
      </svg>
    </button>
    <button class="btn" id="btnNext" title="Next" {{nextDisabled}}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>
    <div class="divider"></div>
    <button class="btn btn-close" id="btnClose" title="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <script>
    const findInput = document.getElementById('findInput');
    const matchCount = document.getElementById('matchCount');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const btnClose = document.getElementById('btnClose');
    
    let viewId = null;
    const findApi = window.eidos?.browser?.find;
    
    // Get viewId from URL
    const url = new URL(window.location.href);
    viewId = decodeURIComponent(url.hostname);
    
    // Focus on load
    findInput.focus();
    findInput.select();
    
    // Update from main
    findApi?.onUpdate?.((data) => {
      if (data.findText !== undefined) {
        findInput.value = data.findText;
      }
      if (data.findActiveMatch !== undefined && data.findMatches !== undefined) {
        if (data.findMatches === 0) {
          matchCount.textContent = '';
        } else {
          matchCount.textContent = data.findActiveMatch + '/' + data.findMatches;
        }
        btnPrev.disabled = data.findMatches === 0;
        btnNext.disabled = data.findMatches === 0;
      }
    });
    
    // Text change
    let debounceTimer;
    findInput.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        if (viewId && findInput.value) {
          findApi?.findInPage?.(viewId, findInput.value);
        } else if (viewId) {
          findApi?.stopFindInPage?.(viewId, 'clearSelection');
          matchCount.textContent = '';
          btnPrev.disabled = true;
          btnNext.disabled = true;
        }
      }, 100);
    });
    
    // Key shortcuts
    findInput.addEventListener('keydown', (e) => {
      if (!viewId) return;
      if (e.key === 'Enter') {
        e.preventDefault();
        if (e.shiftKey) {
          findApi?.findInPage?.(viewId, findInput.value, { forward: false, findNext: true });
        } else {
          findApi?.findInPage?.(viewId, findInput.value, { forward: true, findNext: true });
        }
      } else if (e.key === 'Escape') {
        findApi?.closeFindOverlay?.(viewId);
      }
    });
    
    // Buttons
    btnPrev.addEventListener('click', () => {
      if (!viewId) return;
      findApi?.findInPage?.(viewId, findInput.value, { forward: false, findNext: true });
    });
    
    btnNext.addEventListener('click', () => {
      if (!viewId) return;
      findApi?.findInPage?.(viewId, findInput.value, { forward: true, findNext: true });
    });
    
    btnClose.addEventListener('click', () => {
      if (!viewId) return;
      findApi?.closeFindOverlay?.(viewId);
    });
  </script>
</body>
</html>
