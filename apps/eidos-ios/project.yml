name: EidosIOS
options:
  xcodeVersion: "15.4"
  projectFormat: xcode15_3
  bundleIdPrefix: space.eidos
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGNING_ALLOWED: NO
targets:
  EidosIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: build/editor
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.eidos.ios
        SWIFT_OBJC_BRIDGING_HEADER: Sources/NativeBridge.h
        LIBRARY_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/build/native/$(PLATFORM_NAME)"
        OTHER_LDFLAGS: "$(inherited) -leidos_ios_host -liconv"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Eidos
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          [
            UIInterfaceOrientationPortrait,
            UIInterfaceOrientationLandscapeLeft,
            UIInterfaceOrientationLandscapeRight,
          ]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
  EidosIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: EidosIOS
    settings:
      GENERATE_INFOPLIST_FILE: YES
  EidosIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: EidosIOS
    settings:
      GENERATE_INFOPLIST_FILE: YES
schemes:
  EidosIOS:
    build:
      targets:
        EidosIOS: all
    test:
      targets: [EidosIOSTests, EidosIOSUITests]
