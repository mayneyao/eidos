version: "3.8"

services:
  eidos:
    build:
      context: ../../
      dockerfile: apps/headless/Dockerfile
    container_name: eidos-headless
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_ENDPOINT=${AWS_ENDPOINT:-https://s3.eidos.space}
      - AWS_REGION=${AWS_REGION:-auto}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-eidos-sync}
      - S3_PREFIX=${S3_PREFIX}
      - S3_FILES_PREFIX=${S3_FILES_PREFIX}
      - DATA_DIR=/data
      - PORT=3000
      - HOST=0.0.0.0
      - API_KEY=${API_KEY}
    volumes:
      - eidos-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/health",
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  eidos-data:
