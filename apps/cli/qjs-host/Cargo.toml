[package]
name = "qjs-host"
version = "0.0.0"
edition = "2021"
publish = false
description = "Run the TypeScript Eidos File runtime inside QuickJS over a rusqlite bridge"

[[bin]]
name = "qjs-host"
path = "src/main.rs"

[dependencies]
rquickjs = "0.12"
rusqlite = { version = "0.32", features = [
  "bundled",
  "serialize",
  "functions",
  "limits",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
chrono = "0.4"
anyhow = "1"
tiny_http = "0.12"
open = "5"
rust-embed = { version = "8", features = ["debug-embed"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "stream",
] }
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-tungstenite = { version = "0.27", default-features = false, features = [
  "connect",
  "rustls-tls-native-roots",
] }

[dev-dependencies]
tempfile = "3.19"
