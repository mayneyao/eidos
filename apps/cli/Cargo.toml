[package]
name = "eidos"
version = "3.1.0"
edition = "2024"
description = "Agent-first command-line interface for Eidos File"
authors = ["mayneyao"]
license = "AGPL-3.0"
build = "build.rs"
publish = false

[[bin]]
name = "eidos"
path = "src/main.rs"

[[bin]]
name = "eidos-publish-supervisor"
path = "src/bin/eidos-publish-supervisor.rs"

[dependencies]
eidos-publish.workspace = true
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
open = "5"
flate2 = "1.0"
mime_guess = "2"
pulldown-cmark = "0.13"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
rpassword = "7"
semver = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tiny_http = "0.12"
rusqlite.workspace = true
eidos-file-core.workspace = true
eidos-runtime-host = { workspace = true, features = ["serve"] }
cap-std = "4.0.2"
cap-fs-ext = "4.0.2"

[dev-dependencies]
tempfile = "3.19"
