[package]
name = "eidos"
version = "0.38.0"
edition = "2024"
description = "Agent-first command-line interface for Eidos File"
authors = ["mayneyao"]
license = "AGPL-3.0"
build = "build.rs"

[[bin]]
name = "eidos"
path = "src/main.rs"

[[bin]]
name = "eidos-publish-supervisor"
path = "src/bin/eidos-publish-supervisor.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
open = "5"
mime_guess = "2"
pulldown-cmark = "0.13"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
rpassword = "7"
semver = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tiny_http = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
eidos-file-core = { path = "core" }
qjs-host = { path = "qjs-host" }

[dev-dependencies]
tempfile = "3.19"

# Cargo workspace root. The workspace lives entirely under apps/cli so that
# target/ stays at apps/cli/target and standalone builds remain self-contained.
[workspace]
members = ["core", "qjs-host"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
