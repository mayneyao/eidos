[package]
name = "eidos"
version = "0.36.0"
edition = "2024"
description = "Agent-first command-line interface for Eidos File"
authors = ["mayneyao"]
license = "AGPL-3.0"
build = "build.rs"

[[bin]]
name = "eidos"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
eidos-file-core = { path = "core" }
qjs-host = { path = "qjs-host" }

[dev-dependencies]
tempfile = "3.19"

# Cargo workspace root. The workspace lives entirely under apps/cli so that
# target/ stays at apps/cli/target and the desktop packaging script
# (apps/desktop/scripts/build-cli-local.cjs, runs `cargo build --release`
# in apps/cli) keeps working.
[workspace]
members = ["core", "qjs-host"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
