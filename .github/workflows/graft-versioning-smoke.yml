name: Graft Versioning Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/graft-versioning-smoke.yml"
      - "apps/desktop/electron/modules/data-space/**"
      - "apps/desktop/electron/modules/space-versioning/**"
      - "apps/desktop/scripts/graft-versioning-smoke*"
      - "apps/desktop/scripts/postinstall-sqlite-ext.cjs"
      - "apps/desktop/scripts/graft-runtime-installer*"
      - "apps/desktop/graft-runtime-manifest.json"
      - "pnpm-lock.yaml"
      - "package.json"
      - "apps/desktop/package.json"
  push:
    branches:
      - dev
      - feat/version-control
    paths:
      - ".github/workflows/graft-versioning-smoke.yml"
      - "apps/desktop/electron/modules/data-space/**"
      - "apps/desktop/electron/modules/space-versioning/**"
      - "apps/desktop/scripts/graft-versioning-smoke*"
      - "apps/desktop/scripts/postinstall-sqlite-ext.cjs"
      - "apps/desktop/scripts/graft-runtime-installer*"
      - "apps/desktop/graft-runtime-manifest.json"
      - "pnpm-lock.yaml"
      - "package.json"
      - "apps/desktop/package.json"

env:
  GRAFT_RELEASE_VERSION: v0.6.1

jobs:
  windows-versioning-smoke:
    name: Windows enable-versioning smoke
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Tweak pnpm.cjs
        shell: bash
        run: sed -i 's/\/usr\/bin\/env node/node/g' /c/Users/runneradmin/setup-pnpm/node_modules/.pnpm/pnpm@10.12.4/node_modules/pnpm/bin/pnpm.cjs

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile

      - name: Ensure SQLite extensions are present
        working-directory: apps/desktop
        run: node scripts/postinstall-sqlite-ext.cjs

      - name: Ensure Electron binary is present
        working-directory: apps/desktop
        run: node -e "require('electron/install')"

      - name: Test Graft smoke command transport
        run: pnpm exec vitest run apps/desktop/scripts/graft-runtime-installer.test.ts apps/desktop/scripts/graft-versioning-smoke-command.test.ts --environment node

      - name: Run Graft versioning smoke
        working-directory: apps/desktop
        timeout-minutes: 10
        env:
          ELECTRON_RUN_AS_NODE: "1"
        run: |
          $electron = node -p "require('electron')"
          & $electron scripts/graft-versioning-smoke.cjs
