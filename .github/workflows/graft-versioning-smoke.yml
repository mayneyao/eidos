name: Graft Versioning Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/graft-versioning-smoke.yml"
      - "apps/desktop/electron/modules/data-space/**"
      - "apps/desktop/electron/modules/space-versioning/**"
      - "apps/desktop/scripts/graft-versioning-smoke.cjs"
      - "apps/desktop/scripts/postinstall-sqlite-ext.cjs"
      - "pnpm-lock.yaml"
      - "package.json"
      - "apps/desktop/package.json"
  push:
    branches:
      - dev
      - feat/version-control
    paths:
      - ".github/workflows/graft-versioning-smoke.yml"
      - "apps/desktop/electron/modules/data-space/**"
      - "apps/desktop/electron/modules/space-versioning/**"
      - "apps/desktop/scripts/graft-versioning-smoke.cjs"
      - "apps/desktop/scripts/postinstall-sqlite-ext.cjs"
      - "pnpm-lock.yaml"
      - "package.json"
      - "apps/desktop/package.json"

env:
  GRAFT_RELEASE_VERSION: v0.5.5

jobs:
  windows-versioning-smoke:
    name: Windows enable-versioning smoke
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.19.0"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Tweak pnpm.cjs
        shell: bash
        run: sed -i 's/\/usr\/bin\/env node/node/g' /c/Users/runneradmin/setup-pnpm/node_modules/.pnpm/pnpm@10.12.4/node_modules/pnpm/bin/pnpm.cjs

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile

      - name: Ensure SQLite extensions are present
        working-directory: apps/desktop
        run: node scripts/postinstall-sqlite-ext.cjs

      - name: Ensure Electron binary is present
        working-directory: apps/desktop
        run: node -e "require('electron/install')"

      - name: Run Graft versioning smoke
        working-directory: apps/desktop
        run: pnpm exec electron scripts/graft-versioning-smoke.cjs
