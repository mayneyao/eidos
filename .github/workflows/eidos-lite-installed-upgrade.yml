name: Eidos Lite Installed Upgrade Gates

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: "Published Lite release to validate through the production updater"
        type: string
        required: true

permissions:
  contents: read

jobs:
  mac-in-app-upgrade:
    name: macOS Intel production in-app update
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
      - name: Download and install via the public stable feed
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ inputs.target_tag }}
          EVIDENCE: ${{ runner.temp }}/installed-upgrade-evidence
        run: >-
          node apps/eidos-lite-desktop/scripts/installed-upgrade-smoke.mjs
          --previous-tag=lite-v0.35.1
          "--target-tag=$TARGET_TAG"
          "--evidence=$EVIDENCE"
          --mode=in-app-mac
      - name: Retain public in-app upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: in-app-update-mac-x64
          path: ${{ runner.temp }}/installed-upgrade-evidence
          if-no-files-found: error
          retention-days: 7
