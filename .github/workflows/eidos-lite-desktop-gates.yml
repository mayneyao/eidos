name: Eidos Lite Desktop Gates

on:
  workflow_dispatch:
    inputs:
      retain_staging_packages:
        description: "Retain unsigned macOS staging apps for separate installed E2EE acceptance"
        type: boolean
        default: false
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/eidos-lite-desktop-gates.yml"
      - "apps/eidos-lite-desktop/**"
      - "apps/eidos-file-web/fixtures/**"
      - "packages/eidos-file/**"
      - "packages/eidos-file-ui/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    paths:
      - ".github/workflows/eidos-lite-desktop-gates.yml"
      - "apps/eidos-lite-desktop/**"
      - "apps/eidos-file-web/fixtures/**"
      - "packages/eidos-file/**"
      - "packages/eidos-file-ui/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

concurrency:
  group: eidos-lite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-clone-fixture:
    name: Prepare macOS clone fixture
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Install pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare committed macOS Graft Space
        run: >-
          node apps/eidos-lite-desktop/scripts/prepare-cross-platform-clone-fixture.mjs
          "${{ runner.temp }}/eidos-lite-clone-fixture"

      - name: Upload committed macOS Graft Space
        uses: actions/upload-artifact@v4
        with:
          name: macos-graft-space
          path: ${{ runner.temp }}/eidos-lite-clone-fixture
          include-hidden-files: true
          if-no-files-found: error

  windows-clone-validation:
    name: Windows packaged and clone validation
    needs: macos-clone-fixture
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Install pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download committed macOS Graft Space
        uses: actions/download-artifact@v4
        with:
          name: macos-graft-space
          path: ${{ runner.temp }}/eidos-lite-clone-fixture

      - name: Typecheck
        run: pnpm --filter "@eidos.space/eidos-lite-desktop" typecheck

      - name: Prepare file metadata extension
        run: pnpm --filter "@eidos.space/eidos-lite-desktop" prepare:vtab

      - name: Verify clone validation is read-only
        env:
          EIDOS_LITE_CROSS_PLATFORM_FIXTURE: ${{ runner.temp }}/eidos-lite-clone-fixture
        run: >-
          pnpm --filter "@eidos.space/eidos-lite-desktop" exec node
          ../../scripts/run-electron-node.mjs
          ../../node_modules/vitest/vitest.mjs run
          --config vitest.config.ts
          src/main/runtime/runtime-pool.test.ts
          src/runtime/eidos-file-runtime.test.ts
          src/runtime/cross-platform-clone.test.ts

      - name: Build unsigned staging package
        run: pnpm build:eidos-lite:dev

      - name: Observe fresh packaged smoke
        env:
          EIDOS_LITE_SMOKE_PERFORMANCE_POLICY: observe
        run: pnpm smoke:eidos-lite-packaged

  source-and-real-graft:
    name: Source and real Graft SDK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Install pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @eidos.space/eidos-lite-desktop typecheck

      - name: Test Graft release dependency guard
        run: node --test apps/eidos-lite-desktop/scripts/verify-graft-release.test.mjs apps/eidos-lite-desktop/scripts/graft-snapshot-policy.test.mjs

      - name: Test node:sqlite EA-Connection contract
        run: pnpm --filter @eidos.space/eidos-file test:node-sqlite

      - name: Test source and real Graft SDK
        run: pnpm test:eidos-lite

      - name: Run explicit performance load gate
        run: pnpm --filter @eidos.space/eidos-lite-desktop test:performance

  packaged-macos:
    name: Packaged smoke (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: apple-silicon
            runner: macos-15
          - architecture: intel
            runner: macos-15-intel
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Install pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned staging package
        id: staging-package
        run: pnpm build:eidos-lite:dev

      - name: Observe fresh packaged smoke
        id: observed-smoke
        env:
          EIDOS_LITE_SMOKE_PERFORMANCE_POLICY: observe
        run: pnpm smoke:eidos-lite-packaged

      - name: Enforce packaged performance
        id: enforced-smoke
        run: pnpm smoke:eidos-lite-packaged

      - name: Archive staging app and exact build identity
        id: staging-archive
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.retain_staging_packages && steps.staging-package.outcome == 'success' }}
        env:
          PACKAGE_ARCHITECTURE: ${{ matrix.architecture }}
          OBSERVED_SMOKE_OUTCOME: ${{ steps.observed-smoke.outcome }}
          ENFORCED_SMOKE_OUTCOME: ${{ steps.enforced-smoke.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          node apps/eidos-lite-desktop/scripts/verify-build-environment.mjs staging
          node apps/eidos-lite-desktop/scripts/verify-graft-release.mjs
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import plistlib
          import subprocess

          root = pathlib.Path.cwd()
          app_root = root / "apps/eidos-lite-desktop"
          applications = list((app_root / "dist-app").glob("mac*/Eidos Lite.app"))
          if len(applications) != 1:
              raise RuntimeError(f"Expected one built staging app, found {len(applications)}")
          application = applications[0]
          resources = application / "Contents/Resources"
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "lite-staging-package"
          output.mkdir()
          archive = output / f"eidos-lite-staging-macos-{os.environ['PACKAGE_ARCHITECTURE']}.zip"
          subprocess.run(["ditto", "-c", "-k", "--sequesterRsrc", "--keepParent", str(application), str(archive)], check=True)

          def digest(filename):
              value = hashlib.sha256()
              with filename.open("rb") as source:
                  for chunk in iter(lambda: source.read(1024 * 1024), b""):
                      value.update(chunk)
              return value.hexdigest()

          native_files = sorted(resources.rglob("graft-sdk.*.node"))
          if not native_files:
              raise RuntimeError("Packaged Graft native addon is missing")
          package = json.loads((app_root / "package.json").read_text())
          with (application / "Contents/Info.plist").open("rb") as source:
              bundle = plistlib.load(source)
          identity = {
              "sourceCommit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflowRunId": os.environ["GITHUB_RUN_ID"],
              "workflowRunAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "architecture": os.environ["PACKAGE_ARCHITECTURE"],
              "bundleIdentifier": bundle["CFBundleIdentifier"],
              "bundleVersion": bundle["CFBundleShortVersionString"],
              "signingPolicy": "unsigned staging; not a production release",
              "buildEnvironment": json.loads((app_root / "dist-electron/eidos-lite-build-environment.json").read_text()),
              "graftBuildPolicy": json.loads((app_root / "dist-electron/graft-sdk-build-policy.json").read_text()),
              "registryDependenciesVerified": True,
              "declaredGraftVersion": package["dependencies"]["@eidos.space/graft"],
              "lockfileSha256": digest(root / "pnpm-lock.yaml"),
              "appAsarSha256": digest(resources / "app.asar"),
              "nativeSha256": {str(p.relative_to(application)): digest(p) for p in native_files},
              "archive": {"name": archive.name, "sha256": digest(archive)},
              "genericPackagedSmoke": {
                  "observe": os.environ["OBSERVED_SMOKE_OUTCOME"],
                  "enforce": os.environ["ENFORCED_SMOKE_OUTCOME"],
              },
              "e2eeAcceptance": "not run by this workflow; requires separate installed acceptance",
          }
          manifest = output / "identity.json"
          manifest.write_text(json.dumps(identity, indent=2) + "\n")
          (output / "SHA256SUMS").write_text("".join(f"{digest(p)}  {p.name}\n" for p in [archive, manifest]))
          PY

      - name: Retain staging app for installed acceptance
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.retain_staging_packages && steps.staging-archive.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: eidos-lite-staging-macos-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lite-staging-package
          if-no-files-found: error
          retention-days: 3
