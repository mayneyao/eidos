name: Eidos Lite Offline Candidate Acceptance

# Replace this EXISTING registered workflow only on the dedicated candidate
# branch. No default-branch change, tag, pull_request or push trigger.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Native matrix or a focused Windows repair run
        type: choice
        options: [all, windows]
        default: all

permissions:
  contents: read
  actions: read

concurrency:
  group: lite-offline-candidate-${{ github.ref }}-${{ inputs.target || 'all' }}
  cancel-in-progress: false

jobs:
  candidate:
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && github.ref_name == 'codex/sync-progress-candidate-20261103'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(inputs.target == 'windows' && '{"include":[{"os":"windows-latest","platform":"win32","arch":"x64"}]}' || '{"include":[{"os":"macos-15","platform":"darwin","arch":"arm64"},{"os":"windows-latest","platform":"win32","arch":"x64"},{"os":"macos-15-intel","platform":"darwin","arch":"x64"},{"os":"ubuntu-latest","platform":"linux","arch":"x64"},{"os":"ubuntu-24.04-arm","platform":"linux","arch":"arm64"}]}') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      EIDOS_LITE_SPARK_PUBLIC_KEY_PRODUCTION: ${{ vars.EIDOS_LITE_SPARK_PUBLIC_KEY_PRODUCTION }}
      EIDOS_LITE_SMOKE_PERFORMANCE_POLICY: observe
      EIDOS_TEST_PLANNED_PROGRESS: "1"
      EIDOS_TEST_PLANNED_DOWNLOAD_PROGRESS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - name: Install normal Linux build and desktop services
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libdbus-1-dev pkg-config dbus-x11 xvfb xauth gnome-keyring libgtk-3-0 libnss3 libxss1 libasound2t64 libgbm1 libnotify4 libxtst6 xdg-utils
      - name: Verify immutable private SDK cohort and prepare portable inputs
        run: |
          git merge-base --is-ancestor 5038d986a16d3470ba5e8422bf2616f3086326d6 HEAD
          git diff --exit-code 5038d986a16d3470ba5e8422bf2616f3086326d6 HEAD -- apps/eidos-lite-desktop/src apps/eidos-lite-desktop/scripts apps/eidos-lite-desktop/electron-builder.json apps/eidos-lite-desktop/electron-builder.linux.json crates packages apps/cli Cargo.toml Cargo.lock
          node verification/prepare-candidate.mjs
          pnpm install --frozen-lockfile
      - name: Prove formal registry release guard remains blocked
        run: |
          node - <<'NODE'
          const {spawnSync}=require('node:child_process');
          const fs=require('node:fs');
          const result=spawnSync(process.execPath,['apps/eidos-lite-desktop/scripts/verify-graft-release.mjs'],{encoding:'utf8'});
          fs.writeFileSync('candidate-evidence/registry-guard.txt',result.stdout+result.stderr);
          if(result.status===0 || !/override for @eidos\.space\/graft.*must be removed/.test(result.stderr)) throw new Error('Expected intact registry guard to reject unpublished overrides');
          NODE
      - name: Test source bridge and actual native encrypted operations
        working-directory: apps/eidos-lite-desktop
        run: |
          pnpm prepare:terminal
          pnpm prepare:vtab
          pnpm typecheck
          node ../../scripts/run-electron-node.mjs ../../verification/windows-environment.mjs
          node ../../scripts/run-electron-node.mjs ../../node_modules/vitest/vitest.mjs run --config vitest.config.ts --pool=forks src/main/graft/encrypted-graft-host.local.integration.test.ts src/main/graft/graft-sync-progress.test.ts src/main/sync/sync-run-tracker.test.ts src/renderer/sync-progress-presentation.test.tsx
      - name: Build actual production-address candidate without publishing
        env:
          CSC_LINK: ${{ matrix.platform == 'darwin' && secrets.MACOS_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'darwin' && secrets.MACOS_CERTIFICATE_PWD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform == 'darwin' && 'true' || 'false' }}
        run: node verification/candidate-driver.mjs build
      - name: Accept install upgrade rollback restart and bundled native network progress
        if: matrix.platform != 'linux'
        env:
          GH_TOKEN: ${{ github.token }}
          EIDOS_LITE_SPARK_TEST_CERTIFICATE: ${{ secrets.EIDOS_LITE_SPARK_TEST_CERTIFICATE }}
        run: node verification/candidate-driver.mjs accept
      - name: Accept native Linux desktop with normal Chromium sandbox
        if: matrix.platform == 'linux'
        env:
          GH_TOKEN: ${{ github.token }}
          EIDOS_LITE_SPARK_TEST_CERTIFICATE: ${{ secrets.EIDOS_LITE_SPARK_TEST_CERTIFICATE }}
        run: |
          dbus-run-session -- bash -c 'head -c 32 /dev/urandom | base64 | gnome-keyring-daemon --unlock --components=secrets >/dev/null; exec xvfb-run --auto-servernum node verification/candidate-driver.mjs accept'
      - name: Check retained evidence does not contain credentials
        id: privacy
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EIDOS_LITE_SPARK_TEST_CERTIFICATE: ${{ secrets.EIDOS_LITE_SPARK_TEST_CERTIFICATE }}
        run: node verification/check-artifact-privacy.mjs
      - name: Retain unpublished installers and evidence
        if: always() && steps.privacy.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: lite-unpublished-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            candidate-evidence/
            apps/eidos-lite-desktop/dist-app/*.dmg
            apps/eidos-lite-desktop/dist-app/*.zip
            apps/eidos-lite-desktop/dist-app/*.exe
            apps/eidos-lite-desktop/dist-app/*.deb
            apps/eidos-lite-desktop/dist-app/*.AppImage
            apps/eidos-lite-desktop/dist-app/*.blockmap
            apps/eidos-lite-desktop/dist-app/latest*.yml
          if-no-files-found: error
          retention-days: 7
