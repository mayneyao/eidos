name: Build Desktop Apps

on:
  push:
    tags:
      - "v*"

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.19.0"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Download and extract libsimple
        run: cd apps/desktop && node scripts/download-libsimple.cjs

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: pnpm install

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e "
            const fs = require('fs');
            const v = process.env.TAG.replace(/^v/, '');
            const u = (p) => { const d = JSON.parse(fs.readFileSync(p)); d.version = v; fs.writeFileSync(p, JSON.stringify(d, null, 2) + '\n'); };
            u('./package.json');
            u('./apps/desktop/package.json');
            u('./apps/web-app/package.json');
            let e = fs.readFileSync('packages/lib/env.ts', 'utf8');
            e = e.replace(/EIDOS_VERSION = \".*\"/, 'EIDOS_VERSION = \"' + v + '\"');
            fs.writeFileSync('packages/lib/env.ts', e);
            let c = fs.readFileSync('apps/cli/Cargo.toml', 'utf8');
            c = c.replace(/version = \".*\"/, 'version = \"' + v + '\"');
            fs.writeFileSync('apps/cli/Cargo.toml', c);
            console.log('Synced version to', v);
          "

      - name: Build frontend application
        env:
          NODE_OPTIONS: "--max_old_space_size=8192"
        run: pnpm run build:desktop

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            apps/desktop/dist/
            apps/desktop/dist-electron/
          retention-days: 1

  build-platforms:
    runs-on: ${{ matrix.os }}
    needs: build-frontend
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact_name: windows-artifacts
            list_command: Get-ChildItem -Path apps/desktop/dist-app -Force
            shell: bash
          - os: macos-15-intel
            platform: macos-intel
            artifact_name: macos-intel-artifacts
            needs_codesign: true
            list_command: ls -la apps/desktop/dist-app
          - os: macos-15
            platform: macos-arm
            artifact_name: macos-arm-artifacts
            needs_codesign: true
            list_command: ls -la apps/desktop/dist-app
          - os: ubuntu-latest
            platform: linux
            artifact_name: linux-artifacts
            list_command: ls -la apps/desktop/dist-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.19.0"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Tweak pnpm.cjs (Windows only)
        if: matrix.platform == 'windows'
        run: sed -i 's/\/usr\/bin\/env node/node/g' /c/Users/runneradmin/setup-pnpm/node_modules/.pnpm/pnpm@10.12.4/node_modules/pnpm/bin/pnpm.cjs
        shell: bash

      - name: Download and extract libsimple
        run: cd apps/desktop && node scripts/download-libsimple.cjs

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: pnpm install

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e "
            const fs = require('fs');
            const v = process.env.TAG.replace(/^v/, '');
            const u = (p) => { const d = JSON.parse(fs.readFileSync(p)); d.version = v; fs.writeFileSync(p, JSON.stringify(d, null, 2) + '\n'); };
            u('./package.json');
            u('./apps/desktop/package.json');
            u('./apps/web-app/package.json');
            let e = fs.readFileSync('packages/lib/env.ts', 'utf8');
            e = e.replace(/EIDOS_VERSION = \".*\"/, 'EIDOS_VERSION = \"' + v + '\"');
            fs.writeFileSync('packages/lib/env.ts', e);
            let c = fs.readFileSync('apps/cli/Cargo.toml', 'utf8');
            c = c.replace(/version = \".*\"/, 'version = \"' + v + '\"');
            fs.writeFileSync('apps/cli/Cargo.toml', c);
            console.log('Synced version to', v);
          "

      - name: Build CLI (local script)
        run: node apps/desktop/scripts/build-cli-local.cjs

      - name: Import Code-Signing Certificates (macOS only)
        if: matrix.needs_codesign == true
        uses: Apple-Actions/import-codesign-certs@v1
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}

      - name: Download frontend build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: apps/desktop/

      - name: Build and Sign (${{ matrix.platform }})
        if: matrix.needs_codesign == true
        env:
          APPLEID: ${{ secrets.APPLE_ID }}
          APPLEIDPASS: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLETEAMID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: pnpm run pkg:desktop

      - name: Build without Signing (${{ matrix.platform }})
        if: matrix.needs_codesign != true
        run: pnpm run pkg:desktop

      - name: List dist-app contents
        run: ${{ matrix.list_command }}

      - name: Upload ${{ matrix.platform }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: apps/desktop/dist-app/

  release:
    needs: [build-platforms]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/

      - name: Determine release channel
        id: channel
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [[ "$TAG" == *"-beta"* ]]; then
            echo "channel=beta" >> $GITHUB_OUTPUT
          else
            echo "channel=latest" >> $GITHUB_OUTPUT
          fi
          echo "Release channel: $(cat $GITHUB_OUTPUT | grep channel)"

      - name: Merge macOS update files
        run: chmod +x scripts/merge-macos-updates.sh && ./scripts/merge-macos-updates.sh ./artifacts ${{ steps.channel.outputs.channel }}

      - name: Clean up yml files for release channel
        run: |
          CHANNEL="${{ steps.channel.outputs.channel }}"
          if [ "$CHANNEL" = "beta" ]; then
            # Beta release: remove latest yml files so stable users don't receive beta updates
            rm -f ./artifacts/latest-mac.yml
            rm -f ./artifacts/windows-artifacts/latest.yml
            rm -f ./artifacts/linux-artifacts/latest-linux.yml
            echo "Removed latest-*.yml files for beta release"
          else
            # Stable release: keep both latest and beta yml files so beta users can upgrade to stable
            echo "Stable release: keeping all yml files"
          fi

      - name: Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/windows-artifacts/*.exe
            ./artifacts/windows-artifacts/*.zip
            ./artifacts/macos-intel-artifacts/*.dmg
            ./artifacts/macos-intel-artifacts/*.zip
            ./artifacts/macos-arm-artifacts/*.dmg
            ./artifacts/macos-arm-artifacts/*.zip
            ./artifacts/linux-artifacts/*.AppImage
            ./artifacts/linux-artifacts/*.zip
            ./artifacts/${{ steps.channel.outputs.channel }}-mac.yml
            ./artifacts/windows-artifacts/${{ steps.channel.outputs.channel }}.yml
            ./artifacts/linux-artifacts/${{ steps.channel.outputs.channel }}-linux.yml
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
