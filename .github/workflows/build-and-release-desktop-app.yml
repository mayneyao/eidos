name: Build Desktop Apps

on:
  push:
    tags:
      - "v*"

env:
  GRAFT_RELEASE_VERSION: v0.6.1

jobs:
  extension-delivery:
    uses: ./.github/workflows/extension-delivery.yml

  build-frontend:
    needs: extension-delivery
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Download and extract libsimple
        run: cd apps/desktop && node scripts/download-libsimple.cjs

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e "
            const fs = require('fs');
            const v = process.env.TAG.replace(/^v/, '');
            const u = (p) => { const d = JSON.parse(fs.readFileSync(p)); d.version = v; fs.writeFileSync(p, JSON.stringify(d, null, 2) + '\n'); };
            u('./package.json');
            u('./apps/desktop/package.json');
            u('./apps/web-app/package.json');
            let e = fs.readFileSync('packages/lib/env.ts', 'utf8');
            e = e.replace(/EIDOS_VERSION = \".*\"/, 'EIDOS_VERSION = \"' + v + '\"');
            fs.writeFileSync('packages/lib/env.ts', e);
            console.log('Synced version to', v);
          "

      - name: Build frontend application
        env:
          NODE_OPTIONS: "--max_old_space_size=8192"
        run: pnpm run build:desktop

      - name: Verify generated extension runtime
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          electron_sandbox_path="$(dirname "$(node -p "require.resolve('electron')")")/dist/chrome-sandbox"
          sudo chown root:root "$electron_sandbox_path"
          sudo chmod 4755 "$electron_sandbox_path"
          xvfb-run --auto-servernum pnpm --filter eidos smoke:file-extension-runtime

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            apps/desktop/dist/
            apps/desktop/dist-electron/
          retention-days: 1

  build-platforms:
    runs-on: ${{ matrix.os }}
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact_name: windows-artifacts
            list_command: Get-ChildItem -Path apps/desktop/dist-app -Force
            shell: bash
          - os: macos-15-intel
            platform: macos-intel
            artifact_name: macos-intel-artifacts
            needs_codesign: true
            list_command: ls -la apps/desktop/dist-app
          - os: macos-15
            platform: macos-arm
            artifact_name: macos-arm-artifacts
            needs_codesign: true
            list_command: ls -la apps/desktop/dist-app
          - os: ubuntu-latest
            platform: linux
            artifact_name: linux-artifacts
            list_command: ls -la apps/desktop/dist-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Tweak pnpm.cjs (Windows only)
        if: matrix.platform == 'windows'
        run: sed -i 's/\/usr\/bin\/env node/node/g' /c/Users/runneradmin/setup-pnpm/node_modules/.pnpm/pnpm@10.12.4/node_modules/pnpm/bin/pnpm.cjs
        shell: bash

      - name: Download and extract libsimple
        run: cd apps/desktop && node scripts/download-libsimple.cjs

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e "
            const fs = require('fs');
            const v = process.env.TAG.replace(/^v/, '');
            const u = (p) => { const d = JSON.parse(fs.readFileSync(p)); d.version = v; fs.writeFileSync(p, JSON.stringify(d, null, 2) + '\n'); };
            u('./package.json');
            u('./apps/desktop/package.json');
            u('./apps/web-app/package.json');
            let e = fs.readFileSync('packages/lib/env.ts', 'utf8');
            e = e.replace(/EIDOS_VERSION = \".*\"/, 'EIDOS_VERSION = \"' + v + '\"');
            fs.writeFileSync('packages/lib/env.ts', e);
            console.log('Synced version to', v);
          "

      - name: Build CLI (local script)
        run: node apps/desktop/scripts/build-cli-local.cjs

      - name: Import Code-Signing Certificates (macOS only)
        if: matrix.needs_codesign == true
        uses: Apple-Actions/import-codesign-certs@v1
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}

      - name: Download frontend build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: apps/desktop/

      - name: Build and Sign (${{ matrix.platform }})
        if: matrix.needs_codesign == true
        env:
          APPLEID: ${{ secrets.APPLE_ID }}
          APPLEIDPASS: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLETEAMID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: pnpm run pkg:desktop

      - name: Build without Signing (${{ matrix.platform }})
        if: matrix.needs_codesign != true
        run: pnpm run pkg:desktop

      - name: List dist-app contents
        run: ${{ matrix.list_command }}

      - name: Upload ${{ matrix.platform }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: apps/desktop/dist-app/

  release:
    needs: [build-platforms]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/

      - name: Determine release channel
        id: channel
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [[ "$TAG" =~ -(beta|alpha|rc) ]]; then
            echo "channel=beta" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "channel=latest" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi
          echo "Release channel: $(cat $GITHUB_OUTPUT | grep -E 'channel|prerelease')"

      - name: Merge macOS update files
        run: chmod +x scripts/merge-macos-updates.sh && ./scripts/merge-macos-updates.sh ./artifacts ${{ steps.channel.outputs.channel }}

      - name: Prepare release files
        run: |
          CHANNEL="${{ steps.channel.outputs.channel }}"
          mkdir -p ./release-upload
          # Copy installers (ignore errors if glob doesn't match)
          cp ./artifacts/windows-artifacts/*.exe ./release-upload/ 2>/dev/null || true
          cp ./artifacts/macos-intel-artifacts/*.dmg ./release-upload/ 2>/dev/null || true
          cp ./artifacts/macos-intel-artifacts/*.zip ./release-upload/ 2>/dev/null || true
          cp ./artifacts/macos-arm-artifacts/*.dmg ./release-upload/ 2>/dev/null || true
          cp ./artifacts/macos-arm-artifacts/*.zip ./release-upload/ 2>/dev/null || true
          cp ./artifacts/linux-artifacts/*.AppImage ./release-upload/ 2>/dev/null || true
          # For beta releases, electron-builder generates latest-*.yml instead of beta-*.yml.
          # Rename them so electron-updater can find the correct channel files.
          if [ "$CHANNEL" = "beta" ]; then
            [ -f "./artifacts/beta-mac.yml" ] || cp "./artifacts/latest-mac.yml" "./artifacts/beta-mac.yml" 2>/dev/null || true
            [ -f "./artifacts/windows-artifacts/beta.yml" ] || cp "./artifacts/windows-artifacts/latest.yml" "./artifacts/windows-artifacts/beta.yml" 2>/dev/null || true
            [ -f "./artifacts/linux-artifacts/beta-linux.yml" ] || cp "./artifacts/linux-artifacts/latest-linux.yml" "./artifacts/linux-artifacts/beta-linux.yml" 2>/dev/null || true
          fi
          # Copy yml files for this channel
          cp "./artifacts/${CHANNEL}-mac.yml" ./release-upload/ 2>/dev/null || true
          cp "./artifacts/windows-artifacts/${CHANNEL}.yml" ./release-upload/ 2>/dev/null || true
          cp "./artifacts/linux-artifacts/${CHANNEL}-linux.yml" ./release-upload/ 2>/dev/null || true
          # For stable release, also include beta yml so beta-channel users can upgrade to stable
          if [ "$CHANNEL" = "latest" ]; then
            [ -f "./artifacts/beta-mac.yml" ] && cp "./artifacts/beta-mac.yml" ./release-upload/
            [ -f "./artifacts/windows-artifacts/beta.yml" ] && cp "./artifacts/windows-artifacts/beta.yml" ./release-upload/
            [ -f "./artifacts/linux-artifacts/beta-linux.yml" ] && cp "./artifacts/linux-artifacts/beta-linux.yml" ./release-upload/
          fi
          echo "Files to upload:"
          ls -la ./release-upload/

      - name: Update Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.channel.outputs.prerelease == 'true' }}
          files: ./release-upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
