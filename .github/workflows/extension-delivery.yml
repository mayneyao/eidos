name: Extension Delivery

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/extension-delivery.yml"
      - ".github/workflows/build-and-release-desktop-app.yml"
      - "apps/docs/examples/**"
      - "apps/docs/package.json"
      - "apps/docs/scripts/check-examples.mjs"
      - "apps/docs/src/content/docs/extensions/**"
      - "apps/docs/src/content/docs/zh-cn/extensions/**"
      - "package.json"
      - "packages/extension-*/**"
      - "pnpm-lock.yaml"
      - "scripts/check-extension-package-metadata.mjs"
      - "scripts/file-extension-tooling-smoke.mjs"
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/extension-delivery.yml"
      - ".github/workflows/build-and-release-desktop-app.yml"
      - "apps/docs/examples/**"
      - "apps/docs/package.json"
      - "apps/docs/scripts/check-examples.mjs"
      - "apps/docs/src/content/docs/extensions/**"
      - "apps/docs/src/content/docs/zh-cn/extensions/**"
      - "package.json"
      - "packages/extension-*/**"
      - "pnpm-lock.yaml"
      - "scripts/check-extension-package-metadata.mjs"
      - "scripts/file-extension-tooling-smoke.mjs"

permissions:
  contents: read

concurrency:
  group: extension-delivery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Tooling (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: macos-latest
            platform: macOS
          - os: windows-latest
            platform: Windows
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: pnpm

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate extension package metadata
        run: pnpm check:extension-packages

      - name: Type-check extension CLI
        run: pnpm --filter @eidos.space/extension-cli typecheck

      - name: Test extension CLI
        run: pnpm --filter @eidos.space/extension-cli test

      - name: Verify packed developer tooling
        run: pnpm smoke:extension-tooling

      - name: Validate official examples and documentation
        if: runner.os == 'Linux'
        run: pnpm --filter docs build
