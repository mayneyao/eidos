name: Deploy Download Router

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-download-router
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout deployment ref
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Install pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify download routing
        run: |
          node --test apps/download/src/release-routing.test.mjs
          pnpm --filter download typecheck
          pnpm --filter download exec wrangler deploy --dry-run

      - name: Deploy download Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.102.0"
          workingDirectory: apps/download
          command: deploy
