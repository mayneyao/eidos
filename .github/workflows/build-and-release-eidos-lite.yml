name: Build and Release Eidos Lite

on:
  push:
    tags:
      - "lite-v*"

permissions:
  contents: write

concurrency:
  group: eidos-lite-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Install pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag and committed base version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs"
          const tag = process.env.TAG
          const match = /^lite-v(\d+\.\d+\.\d+)(?:-(?:alpha|beta|rc)\.\d+)?$/.exec(tag ?? "")
          if (!match) throw new Error(`Invalid Eidos Lite release tag: ${tag}`)
          const pkg = JSON.parse(fs.readFileSync("apps/eidos-lite-desktop/package.json", "utf8"))
          if (pkg.version !== match[1]) {
            throw new Error(`Tag base ${match[1]} does not match committed Lite version ${pkg.version}`)
          }
          NODE

      - name: Audit single-release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          node .codex/skills/eidos-release/scripts/audit-release-notes.mjs \
            --surface lite \
            --tag "$TAG" \
            --unpublished-tag lite-v0.1.14 \
            --unpublished-tag lite-v0.1.15 \
            --unpublished-tag lite-v0.1.16 \
            --unpublished-tag lite-v0.1.17 \
            --unpublished-tag lite-v0.7.0 \
            --unpublished-tag lite-v0.7.1

      - name: Typecheck
        run: pnpm --filter @eidos.space/eidos-lite-desktop typecheck

      - name: Test source and updater contracts
        run: pnpm test:eidos-lite

      - name: Test download and update routing
        run: node --test apps/download/src/release-routing.test.mjs

      - name: Build production assets
        run: pnpm --filter @eidos.space/eidos-lite-desktop build:release

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.architecture }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            architecture: arm64
            runner: macos-15
            artifact: lite-mac-arm64
          - platform: mac
            architecture: x64
            runner: macos-15-intel
            artifact: lite-mac-x64
          - platform: win
            architecture: x64
            runner: windows-latest
            artifact: lite-win-x64
          - platform: linux
            architecture: x64
            runner: ubuntu-latest
            artifact: lite-linux-x64
          - platform: linux
            architecture: arm64
            runner: ubuntu-24.04-arm
            artifact: lite-linux-arm64
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Setup Rust for the bundled Publish engine
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply full tag version to package
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs"
          const version = process.env.TAG.replace(/^lite-v/, "")
          const file = "apps/eidos-lite-desktop/package.json"
          const pkg = JSON.parse(fs.readFileSync(file, "utf8"))
          pkg.version = version
          fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`)
          NODE

      - name: Install native FPM on Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo gem install --no-document fpm -v 1.15.1
          test "$(fpm --version)" = 1.15.1

      - name: Require macOS signing inputs
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"

      - name: Build signed and notarized macOS release
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: true
        shell: bash
        run: |
          pnpm --filter @eidos.space/eidos-lite-desktop build:release
          pnpm --filter @eidos.space/eidos-lite-desktop prepare:publish-engine
          pnpm --filter @eidos.space/eidos-lite-desktop exec electron-builder \
            --publish never \
            --config electron-builder.json \
            --config.mac.notarize.teamId="$APPLE_TEAM_ID"

      - name: Build unsigned Windows release
        if: matrix.platform == 'win'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm build:eidos-lite:release

      - name: Build unsigned Linux release
        if: matrix.platform == 'linux'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          USE_SYSTEM_FPM: true
        run: pnpm build:eidos-lite:release:linux

      - name: Verify macOS signature and notarization
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          application="$(find apps/eidos-lite-desktop/dist-app -type d -name 'Eidos Lite.app' -print -quit)"
          test -n "$application"
          codesign --verify --deep --strict --verbose=2 "$application"
          xcrun stapler validate "$application"

      - name: Verify Windows installer is unsigned by policy
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/eidos-lite-desktop/dist-app/*.exe | Select-Object -First 1
          if (-not $installer) { throw "Eidos Lite installer is missing" }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "NotSigned") { throw "Expected an unsigned Windows installer, got: $($signature.Status)" }

      - name: Install and validate Debian package
        if: matrix.platform == 'linux'
        shell: bash
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          package="$(find apps/eidos-lite-desktop/dist-app -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$package"
          package="$(realpath "$package")"
          expected_architecture="$EXPECTED_ARCHITECTURE"
          if [[ "$expected_architecture" == x64 ]]; then
            expected_architecture=amd64
          fi
          test "$(dpkg-deb --field "$package" Package)" = eidos-lite
          test "$(dpkg-deb --field "$package" Architecture)" = "$expected_architecture"
          sudo apt-get install -y "$package"
          test "$(dpkg-query --show --showformat='${Status}' eidos-lite)" = "install ok installed"
          installed_executable="$(command -v eidos-lite-desktop)"
          test -x "$installed_executable"
          test "$(realpath "$installed_executable")" = /opt/eidos-lite/eidos-lite-desktop
          sandbox="$(dpkg-query --listfiles eidos-lite | awk '/\/chrome-sandbox$/ { print; exit }')"
          test -n "$sandbox"
          test "$(stat -c '%U:%G:%a' "$sandbox")" = root:root:4755

      - name: Validate fresh packaged release
        if: matrix.platform != 'linux'
        env:
          EIDOS_LITE_SMOKE_EXPECTED_ENVIRONMENT: production
          EIDOS_LITE_SMOKE_PERFORMANCE_POLICY: observe
        run: pnpm smoke:eidos-lite-packaged

      - name: Validate fresh packaged Linux release
        if: matrix.platform == 'linux'
        shell: bash
        env:
          EIDOS_LITE_SMOKE_EXPECTED_ENVIRONMENT: production
          EIDOS_LITE_SMOKE_PERFORMANCE_POLICY: observe
        run: |
          if ! command -v xvfb-run >/dev/null || ! command -v dbus-run-session >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y dbus-x11 xvfb
          fi
          executable="$(command -v eidos-lite-desktop)"
          test -n "$executable"
          EIDOS_LITE_PACKAGED_APP="$executable" dbus-run-session -- xvfb-run --auto-servernum pnpm smoke:eidos-lite-packaged

      - name: Enforce packaged macOS release performance
        if: matrix.platform == 'mac'
        env:
          EIDOS_LITE_SMOKE_EXPECTED_ENVIRONMENT: production
        run: pnpm smoke:eidos-lite-packaged

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 2
          path: |
            apps/eidos-lite-desktop/dist-app/*.dmg
            apps/eidos-lite-desktop/dist-app/*.zip
            apps/eidos-lite-desktop/dist-app/*.exe
            apps/eidos-lite-desktop/dist-app/*.AppImage
            apps/eidos-lite-desktop/dist-app/*.deb
            apps/eidos-lite-desktop/dist-app/*.blockmap
            apps/eidos-lite-desktop/dist-app/latest*.yml

  deploy-update-router:
    name: Deploy Lite update router
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Deploy download Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.102.0"
          workingDirectory: apps/download
          command: deploy

  release:
    name: Publish GitHub Release
    needs: [build, deploy-update-router]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Download platform assets
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare channel-specific release assets
        id: release
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#lite-v}"
          if [[ "$version" =~ -(alpha|beta|rc)\. ]]; then
            channel=beta
            prerelease=true
          else
            channel=latest
            prerelease=false
          fi
          mkdir release-upload
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.blockmap' \) -exec cp {} release-upload/ \;

          copy_metadata() {
            local artifact="$1"
            local source_name="$2"
            local platform="$3"
            local architecture="$4"
            local source
            source="$(find "artifacts/$artifact" -type f -name "$source_name" -print -quit)"
            test -n "$source"
            cp "$source" "release-upload/${channel}-${platform}-${architecture}.yml"
            if [[ "$channel" == latest ]]; then
              cp "$source" "release-upload/beta-${platform}-${architecture}.yml"
            fi
          }

          copy_metadata lite-mac-arm64 latest-mac.yml mac arm64
          copy_metadata lite-mac-x64 latest-mac.yml mac x64
          copy_metadata lite-win-x64 latest.yml win x64
          copy_metadata lite-linux-x64 latest-linux.yml linux x64
          copy_metadata lite-linux-arm64 latest-linux-arm64.yml linux arm64

          test -f "release-upload/Eidos Lite-${version}-mac-arm64.dmg"
          test -f "release-upload/Eidos Lite-${version}-mac-arm64.zip"
          test -f "release-upload/Eidos Lite-${version}-mac-x64.dmg"
          test -f "release-upload/Eidos Lite-${version}-mac-x64.zip"
          test -f "release-upload/Eidos Lite-${version}-win-x64.exe"
          # electron-builder renders the Linux x64 `${arch}` macro as `x86_64`.
          test -f "release-upload/Eidos Lite-${version}-linux-x86_64.AppImage"
          test -f "release-upload/Eidos Lite-${version}-linux-arm64.AppImage"
          # Debian uses its canonical x64 architecture name, `amd64`.
          test -f "release-upload/Eidos Lite-${version}-linux-amd64.deb"
          test -f "release-upload/Eidos Lite-${version}-linux-arm64.deb"
          test -f "release-upload/${channel}-mac-arm64.yml"
          test -f "release-upload/${channel}-mac-x64.yml"
          test -f "release-upload/${channel}-win-x64.yml"
          test -f "release-upload/${channel}-linux-x64.yml"
          test -f "release-upload/${channel}-linux-arm64.yml"
          grep -Fq "Eidos Lite-${version}-linux-amd64.deb" "release-upload/${channel}-linux-x64.yml"
          grep -Fq "Eidos Lite-${version}-linux-arm64.deb" "release-upload/${channel}-linux-arm64.yml"

          (cd release-upload && sha256sum * > SHA256SUMS)
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          find release-upload -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Eidos Lite ${{ steps.release.outputs.version }}
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
          generate_release_notes: false
          body_path: apps/eidos-lite-desktop/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: release-upload/*

      - name: Verify published release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          published="$RUNNER_TEMP/published-release-notes.md"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body \
            | jq --join-output '.body' > "$published"
          diff -u apps/eidos-lite-desktop/RELEASE_NOTES.md "$published"

      - name: Verify live update metadata
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#lite-v}"
          if [[ "$version" =~ -(alpha|beta|rc)\. ]]; then
            channel=beta
            metadata=beta
          else
            channel=stable
            metadata=latest
          fi
          for route in \
            "$channel/arm64/${metadata}-mac.yml" \
            "$channel/x64/${metadata}-mac.yml" \
            "$channel/x64/${metadata}.yml" \
            "$channel/arm64/${metadata}-linux.yml" \
            "$channel/x64/${metadata}-linux.yml"; do
            response=""
            for attempt in {1..20}; do
              if response="$(curl --fail --location --silent --show-error \
                --retry 2 --retry-all-errors --retry-delay 3 \
                "https://download.eidos.space/lite/updates/$route")" && \
                grep -Fq "version: $version" <<< "$response"; then
                break
              fi
              if (( attempt == 20 )); then
                observed="$(awk -F ': ' '/^version: / { print $2; exit }' <<< "$response")"
                echo "::error::Update route $route did not publish version $version (observed ${observed:-unavailable})"
                exit 1
              fi
              sleep 3
            done
            asset="$(awk -F ': ' '/^path: / { print $2; exit }' <<< "$response")"
            test -n "$asset"
            asset="${asset// /%20}"
            curl --fail --location --range 0-0 --output /dev/null \
              --retry 5 --retry-all-errors --retry-delay 3 \
              "https://download.eidos.space/lite/updates/${route%/*}/$asset"
          done
