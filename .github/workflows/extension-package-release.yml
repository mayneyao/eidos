name: Extension Package Release
run-name: Extension packages v${{ inputs.version }} (${{ inputs.mode }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact shared package version, without a v prefix
        required: true
        type: string
      mode:
        description: Plan only, bootstrap unpublished packages, or stage an update
        required: true
        default: plan
        type: choice
        options:
          - plan
          - bootstrap
          - stage

permissions:
  contents: read

concurrency:
  group: extension-package-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  extension-delivery:
    uses: ./.github/workflows/extension-delivery.yml

  plan:
    needs: extension-delivery
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4

      - name: Verify immutable release ref
        if: inputs.mode != 'plan'
        run: >-
          node -e
          "if (process.env.GITHUB_REF_TYPE !== 'tag' || process.env.GITHUB_REF_NAME !== process.env.EXPECTED_TAG) {
          throw new Error('Select the exact release tag ' + process.env.EXPECTED_TAG)
          }"
        env:
          EXPECTED_TAG: extension-tooling-v${{ inputs.version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install release npm CLI
        run: npm install --global npm@11.18.0

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test release planner
        run: pnpm test:extension-release

      - name: Pack and inspect release
        run: >-
          pnpm release:extension-packages
          --mode ${{ inputs.mode }}
          --version ${{ inputs.version }}
          --output-dir extension-release-plan

      - name: Upload reviewed release plan
        uses: actions/upload-artifact@v4
        with:
          name: extension-packages-${{ inputs.version }}-plan
          path: extension-release-plan/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: inputs.mode != 'plan'
    needs:
      - extension-delivery
      - plan
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js and npm registry
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Install release npm CLI
        run: npm install --global npm@11.18.0

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download reviewed release artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-packages-${{ inputs.version }}-plan
          path: extension-release-reviewed

      - name: Verify and bootstrap reviewed release
        if: inputs.mode == 'bootstrap'
        run: >-
          pnpm release:extension-packages
          --mode bootstrap
          --version ${{ inputs.version }}
          --artifact-dir extension-release-reviewed
          --publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify and stage reviewed release
        if: inputs.mode == 'stage'
        run: >-
          pnpm release:extension-packages
          --mode stage
          --version ${{ inputs.version }}
          --artifact-dir extension-release-reviewed
          --publish
