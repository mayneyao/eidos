name: Build and validate Lite macOS x64

on:
  workflow_call:
  workflow_dispatch:

# This workflow only creates artifacts. The caller owns publication after acceptance.
permissions:
  contents: read
  actions: read

env:
  EIDOS_LITE_SPARK_PUBLIC_KEY_PRODUCTION: ${{ vars.EIDOS_LITE_SPARK_PUBLIC_KEY_PRODUCTION }}
  EIDOS_LITE_SPARK_TEST_CERTIFICATE: ${{ secrets.EIDOS_LITE_SPARK_TEST_CERTIFICATE }}
  EIDOS_LITE_SPARK_REQUIRE_SIGNED_TEST_CERTIFICATE: "1"

jobs:
  cross-build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Apply release tag version
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          if (process.env.GITHUB_REF_TYPE === 'tag') {
            if (!/^lite-v\d+\.\d+\.\d+(?:-(?:alpha|beta|rc)\.\d+)?$/.test(process.env.GITHUB_REF_NAME)) throw Error('Invalid Lite tag')
            const file = 'apps/eidos-lite-desktop/package.json'
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'))
            pkg.version = process.env.GITHUB_REF_NAME.slice(6)
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n')
          }
          JS
      - name: Verify ARM host and disable indexing
        run: |
          test "$(uname -m)" = arm64
          sudo mdutil -a -i off
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: pnpm/setup@v2
        with:
          install: false
      - name: Install host and target optional dependencies
        run: |
          cat >> pnpm-workspace.yaml <<'YAML'

          supportedArchitectures:
            os: [darwin]
            cpu: [arm64, x64]
          YAML
          pnpm install --frozen-lockfile
      - name: Test packaging retry and publication gates
        run: node --test apps/eidos-lite-desktop/scripts/package-macos-release.test.mjs apps/eidos-lite-desktop/scripts/macos-release-workflow.test.mjs
      - name: Verify native ARM encrypted Sync host
        working-directory: apps/eidos-lite-desktop
        run: node ../../scripts/run-electron-node.mjs ../../node_modules/vitest/vitest.mjs run --config vitest.config.ts src/main/graft/encrypted-graft-host.local.integration.test.ts
      - name: Build JavaScript with native ARM tools
        run: |
          pnpm --filter @eidos.space/eidos-lite-desktop verify:graft-release
          pnpm --filter @eidos.space/eidos-lite-desktop prepare:terminal
          pnpm --filter @eidos.space/eidos-file build
          pnpm --filter @eidos.space/plugin-sandbox exec tsc -p tsconfig.build.json
          pnpm --filter @eidos.space/eidos-lite-desktop exec vite build --mode eidos-release
          node apps/eidos-lite-desktop/scripts/verify-build-environment.mjs production
          node apps/eidos-lite-desktop/scripts/verify-electron-output.mjs
      - name: Cross-compile both Rust executables for Intel
        run: |
          node packages/plugin-sandbox/scripts/build-web.mjs --check
          cargo build --release --locked --target x86_64-apple-darwin -p eidos -p eidos-plugin-sandbox-cli
          mkdir -p apps/eidos-lite-desktop/resources/{publish-engine,plugin-sandbox}
          cp target/x86_64-apple-darwin/release/eidos apps/eidos-lite-desktop/resources/publish-engine/eidos
          cp target/x86_64-apple-darwin/release/plugin-sandbox apps/eidos-lite-desktop/resources/plugin-sandbox/plugin-sandbox
          TARGET_ARCH=x64 pnpm --filter @eidos.space/eidos-lite-desktop prepare:vtab
          lipo apps/eidos-lite-desktop/resources/publish-engine/eidos -verify_arch x86_64
          lipo apps/eidos-lite-desktop/resources/plugin-sandbox/plugin-sandbox -verify_arch x86_64
          lipo apps/eidos-lite-desktop/resources/vtab/libfs_meta.dylib -verify_arch x86_64
      - name: Package, sign and notarize x64
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
        run: node apps/eidos-lite-desktop/scripts/package-macos-release.mjs x64
      - name: Verify the signed target bundle
        run: |
          app='apps/eidos-lite-desktop/dist-app/mac/Eidos Lite.app'
          test -d "$app"
          lipo "$app/Contents/MacOS/Eidos Lite" -verify_arch x86_64
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
      - uses: actions/upload-artifact@v4
        with:
          name: lite-mac-x64
          path: |
            apps/eidos-lite-desktop/dist-app/*.dmg
            apps/eidos-lite-desktop/dist-app/*.zip
            apps/eidos-lite-desktop/dist-app/*.blockmap
            apps/eidos-lite-desktop/dist-app/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

  intel-validation:
    needs: cross-build
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/setup@v2
        with:
          install: false
      - name: Install the locked Electron acceptance runtime
        run: pnpm install --frozen-lockfile
      - name: Verify native Intel encrypted Sync host
        working-directory: apps/eidos-lite-desktop
        run: node ../../scripts/run-electron-node.mjs ../../node_modules/vitest/vitest.mjs run --config vitest.config.ts src/main/graft/encrypted-graft-host.local.integration.test.ts
      - uses: actions/download-artifact@v4
        with:
          name: lite-mac-x64
          path: apps/eidos-lite-desktop/dist-app
      - name: Run the cross-built package on real Intel
        env:
          GH_TOKEN: ${{ github.token }}
          EIDOS_LITE_SMOKE_EXPECTED_ENVIRONMENT: production
          EIDOS_LITE_SMOKE_PERFORMANCE_POLICY: observe
        run: |
          test "$(uname -m)" = x86_64
          version="$(node -p 'require("./apps/eidos-lite-desktop/package.json").version')"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version="${GITHUB_REF_NAME#lite-v}"; fi
          ditto -x -k "apps/eidos-lite-desktop/dist-app/Eidos Lite-$version-mac-x64.zip" "$RUNNER_TEMP/cross-built"
          app="$RUNNER_TEMP/cross-built/Eidos Lite.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          binary="$app/Contents/Resources/plugin-sandbox/plugin-sandbox"
          lipo "$binary" -verify_arch x86_64
          codesign --verify --strict "$binary"
          python3 packages/plugin-sandbox/tests/smoke.py "$binary"
          EIDOS_LITE_PACKAGED_APP="$app/Contents/MacOS/Eidos Lite" node apps/eidos-lite-desktop/scripts/packaged-smoke.mjs
          node apps/eidos-lite-desktop/scripts/installed-upgrade-smoke.mjs --previous-tag=lite-v0.25.0 "--candidate=$PWD/apps/eidos-lite-desktop/dist-app/Eidos Lite-$version-mac-x64.dmg" "--version=$version" "--evidence=$RUNNER_TEMP/cross-install-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installation-evidence-mac-x64
          path: ${{ runner.temp }}/cross-install-evidence
          retention-days: 7
