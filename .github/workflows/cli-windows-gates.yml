name: CLI Windows Gates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/cli-windows-gates.yml"
      - ".github/workflows/build-and-release-cli.yml"
      - "apps/cli/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packages/eidos-file/**"
      - "packages/eidos-file-ui/**"
      - "packages/eidos-file-serve/**"
      - "packages/markdown/**"
      - "scripts/build-quickjs.mjs"
      - "scripts/generated-assets.mjs"
      - "packages/plugin-runtime/**"
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/cli-windows-gates.yml"
      - ".github/workflows/build-and-release-cli.yml"
      - "apps/cli/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packages/eidos-file/**"
      - "packages/eidos-file-ui/**"
      - "packages/eidos-file-serve/**"
      - "packages/markdown/**"
      - "scripts/build-quickjs.mjs"
      - "scripts/generated-assets.mjs"
      - "packages/plugin-runtime/**"

permissions:
  contents: read

concurrency:
  group: cli-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked --features eidos-mobile-host/ffi -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked --features eidos-mobile-host/ffi

      - name: Build release binary
        run: cargo build -p eidos --release --locked

      - name: Smoke-test embedded editor
        shell: pwsh
        run: ./apps/cli/windows-serve-smoke.ps1 -Binary ./target/release/eidos.exe
