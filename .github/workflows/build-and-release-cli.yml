name: Build and Release CLI

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: read

concurrency:
  group: cli-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify tag and version contract
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#cli-v}"
          cargo_version="$(cargo metadata --manifest-path apps/cli/Cargo.toml --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "eidos"))')"
          if [[ "$TAG" != "cli-v$version" || "$version" != "$cargo_version" ]]; then
            echo "Tag $TAG does not match apps/cli/Cargo.toml version $cargo_version" >&2
            exit 1
          fi
          if [[ "$version" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
            latest="$(tr -d '[:space:]' < apps/cli/LATEST)"
            if [[ "$latest" != "$version" ]]; then
              echo "Stable tag $TAG requires apps/cli/LATEST to contain $version" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        working-directory: apps/cli
        run: cargo fmt --all --check

      - name: Run Clippy
        working-directory: apps/cli
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        working-directory: apps/cli
        run: cargo test --workspace --locked

      - name: Test release contract and Unix installer
        run: node --test apps/cli/install.test.mjs apps/cli/release.test.mjs apps/download/src/release-routing.test.mjs

      - name: Smoke-test public Eidos Skill install
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          qa_dir="$(mktemp -d)"
          cd "$qa_dir"
          npx -y skills add \
            "https://github.com/${REPOSITORY}/tree/${TAG}/skills/eidos" \
            --skill eidos -a codex -y
          test -f .agents/skills/eidos/SKILL.md
          test -f .agents/skills/eidos/agents/openai.yaml
          test -f .agents/skills/eidos/references/cli.md
          test -f .agents/skills/eidos/references/operations.md
          grep -F "name: eidos" .agents/skills/eidos/SKILL.md

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            binary: apps/cli/target/release/eidos
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: apps/cli/target/release/eidos
            archive: tar.gz
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: apps/cli/target/release/eidos
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: apps/cli/target/release/eidos.exe
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        working-directory: apps/cli
        run: cargo build --release --locked

      - name: Verify binary version
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          "$BINARY" --version | grep -F "eidos $VERSION ("

      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-package
          cp "$BINARY" release-package/eidos
          chmod 755 release-package/eidos
          tar -czf "eidos-cli-v${VERSION}-${TARGET}.tar.gz" -C release-package eidos

      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          BINARY: ${{ matrix.binary }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force release-package | Out-Null
          Copy-Item $env:BINARY release-package/eidos.exe
          Compress-Archive -Path release-package/eidos.exe -DestinationPath "eidos-cli-v$env:VERSION-$env:TARGET.zip"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("apps/cli/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: eidos-cli-${{ matrix.target }}
          path: eidos-cli-v${{ needs.verify.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [verify, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: eidos-cli-*
          path: release-assets
          merge-multiple: true

      - name: Prepare and verify release assets
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          expected=(
            "eidos-cli-v${VERSION}-aarch64-apple-darwin.tar.gz"
            "eidos-cli-v${VERSION}-x86_64-apple-darwin.tar.gz"
            "eidos-cli-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            "eidos-cli-v${VERSION}-x86_64-pc-windows-msvc.zip"
          )
          for asset in "${expected[@]}"; do
            test -f "release-assets/$asset" || { echo "Missing $asset" >&2; exit 1; }
          done
          actual_count="$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "$actual_count" = "${#expected[@]}" || { echo "Unexpected release asset count: $actual_count" >&2; exit 1; }
          cp apps/cli/install.sh release-assets/eidos-installer.sh
          cp apps/cli/install.ps1 release-assets/eidos-installer.ps1
          (
            cd release-assets
            sha256sum eidos-cli-* eidos-installer.sh eidos-installer.ps1 > SHA256SUMS
          )
          cat release-assets/SHA256SUMS

      - name: Publish CLI GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Eidos CLI v${{ needs.verify.outputs.version }}
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          make_latest: false
          generate_release_notes: true
          body: |
            Install on macOS or Linux:

            ```sh
            curl --proto '=https' --tlsv1.2 -LsSf https://download.eidos.space/cli/install.sh | sh
            ```

            Install on Windows PowerShell:

            ```powershell
            irm https://download.eidos.space/cli/install.ps1 | iex
            ```

            Install the matching Eidos Skill for Codex:

            ```sh
            npx skills add https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}/skills/eidos --skill eidos -g -a codex -y
            ```
          files: |
            release-assets/eidos-cli-*
            release-assets/eidos-installer.sh
            release-assets/eidos-installer.ps1
            release-assets/SHA256SUMS
