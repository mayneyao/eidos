name: Eidos Lite Performance Report

on:
  workflow_run:
    workflows: ["Eidos Lite Desktop Gates"]
    types: [completed]
  workflow_dispatch:
    inputs:
      desktop_run_id:
        description: "Completed PR Desktop Gates run whose retained app should be measured once"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: lite-performance-${{ github.event.workflow_run.id || inputs.desktop_run_id }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve trusted PR build
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.source.outputs.eligible }}
      run-id: ${{ steps.source.outputs.run-id }}
      head-sha: ${{ steps.source.outputs.head-sha }}
      pr-number: ${{ steps.source.outputs.pr-number }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/github-script@v7
        id: source
        env:
          DESKTOP_RUN_ID: ${{ github.event.workflow_run.id || inputs.desktop_run_id }}
        with:
          script: |
            core.setOutput('eligible', 'false')
            if (!/^\d+$/.test(process.env.DESKTOP_RUN_ID)) throw new Error('Invalid run ID')
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: Number(process.env.DESKTOP_RUN_ID),
            })
            if (run.path !== '.github/workflows/eidos-lite-desktop-gates.yml' ||
                run.event !== 'pull_request' || run.conclusion !== 'success' ||
                run.head_repository.id !== context.payload.repository.id) return
            const pulls = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              ...context.repo, commit_sha: run.head_sha,
            })
            const pr = pulls.find(item => item.head.sha === run.head_sha &&
              item.head.repo?.id === context.payload.repository.id)
            if (!pr) return
            const { data: live } = await github.rest.pulls.get({ ...context.repo, pull_number: pr.number })
            if (live.head.sha !== run.head_sha) return
            const { data: file } = await github.rest.repos.getContent({
              ...context.repo, path: 'apps/eidos-lite-desktop/package.json', ref: run.head_sha,
            })
            const version = JSON.parse(Buffer.from(file.content, 'base64').toString()).version
            if (!/^\d+\.\d+\.\d+(?:-[\w.-]+)?$/.test(version)) throw new Error('Invalid version')
            core.setOutput('eligible', 'true')
            core.setOutput('run-id', String(run.id))
            core.setOutput('head-sha', run.head_sha)
            core.setOutput('pr-number', String(pr.number))
            core.setOutput('version', version)

  installed-measurement:
    name: Measure the retained app once
    needs: resolve
    if: needs.resolve.outputs.eligible == 'true'
    uses: ./.github/workflows/eidos-lite-macos-performance.yml
    with:
      staging-artifacts: true
      artifact-run-id: ${{ fromJSON(needs.resolve.outputs.run-id) }}
      source-head: ${{ needs.resolve.outputs.head-sha }}

  source-load:
    name: Record source workload results
    needs: resolve
    if: needs.resolve.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      outcome: ${{ steps.workload.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.head-sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
      - uses: pnpm/setup@v2
        with:
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @eidos.space/eidos-lite-desktop prepare:terminal
      - run: pnpm --filter @eidos.space/eidos-lite-desktop prepare:vtab
      - name: Record workload reference checks
        id: workload
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @eidos.space/eidos-lite-desktop test:performance | tee "$RUNNER_TEMP/source-load.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lite-source-load-report
          path: ${{ runner.temp }}/source-load.log
          if-no-files-found: warn
          retention-days: 30

  comment:
    name: Compare with the previous release and comment on the PR
    needs: [resolve, installed-measurement, source-load]
    if: always() && needs.resolve.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
      statuses: write
    steps:
      # This job has write access: never check out or execute PR code here.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
      - run: mkdir -p "$RUNNER_TEMP/performance-reports"
      - uses: actions/download-artifact@v4
        with:
          pattern: installed-macos-performance-*
          path: ${{ runner.temp }}/performance-reports
      - name: Store the report and only fail on a major regression
        env:
          GH_TOKEN: ${{ github.token }}
          PERF_PR_NUMBER: ${{ needs.resolve.outputs.pr-number }}
          PERF_HEAD_SHA: ${{ needs.resolve.outputs.head-sha }}
          PERF_VERSION: ${{ needs.resolve.outputs.version }}
          PERF_REPORT_DIR: ${{ runner.temp }}/performance-reports
          PERF_SOURCE_LOAD: ${{ needs.source-load.outputs.outcome || needs.source-load.result }}
        run: node apps/eidos-lite-desktop/scripts/lite-performance-report.mjs comment
