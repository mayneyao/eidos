[package]
name = "eidos-mobile-host"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
ffi = []
# Mobile builds enable this against the pinned upstream SDK's planned transfer API.
planned-transfer-progress = []

[dependencies]
anyhow = "1"
eidos-publish.workspace = true
eidos-file-core.workspace = true
tempfile = "3.19"
rusqlite = { workspace = true, features = ["backup"] }
eidos-runtime-host.workspace = true
serde_json = "1"
graft-sdk = { workspace = true, features = ["e2ee"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
url = "2"
zeroize = "1"

[target.'cfg(target_os = "ios")'.dependencies]
rquickjs = { version = "0.12", features = ["bindgen"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
rquickjs = { version = "0.12", features = ["bindgen"] }

[dev-dependencies]
tempfile = "3.19"
tiny_http = "0.12"
