[package]
name = "eidos-plugin-sandbox"
version = "0.3.0"
edition = "2021"
publish = false
description = "Capability-controlled QuickJS runtime for plugin background processes"

[dependencies]
anyhow = "1"
rquickjs = "=0.12.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
url = "2.5"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
btleplug = "0.13.5"
uuid = { version = "1", features = ["serde"] }
