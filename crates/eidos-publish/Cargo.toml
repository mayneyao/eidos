[package]
name = "eidos-publish"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
flate2 = "1.0"
mime_guess = "2"
pulldown-cmark = "0.13"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite.workspace = true
eidos-file-core.workspace = true

[dev-dependencies]
tempfile = "3.19"
tiny_http = "0.12"
